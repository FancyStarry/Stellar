subprojects {
    plugins.withId("com.android.base") {
        android {
            compileSdk = 37
            // Google 已不再发布 platforms;android-37，只发布 37.0/37.1/37.2，
            // 不指定 minor 时 AGP 会去找 android-37 而报 "Failed to find target"
            compileSdkMinor = 0
            ndkVersion = "29.0.13113456"
            
            defaultConfig {
                minSdk = 24
                targetSdk = 37
            }
            
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

apply from: 'api/manifest.gradle'

ext {
    versionCode = 101000
    versionName = "1.1"
}
